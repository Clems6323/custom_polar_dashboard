services:

  # ─── Polar analytics dashboard ───────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: polar-dashboard:latest
    container_name: polar-dashboard
    restart: unless-stopped

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      # Persist the database, tokens, and parquet files across restarts.
      # Run `docker compose up` from the project root so Docker resolves
      # ./data relative to this file.
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    networks:
      - polar-net

  # ─── n8n workflow automation (Telegram bridge) ───────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: polar-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      # Data persistence
      - N8N_USER_FOLDER=/home/node/.n8n
      # URL used by the browser to open the editor
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      # Public HTTPS URL that Telegram (and other services) POST webhooks to.
      # Must match the Cloudflare Tunnel hostname configured in the dashboard.
      # Example: https://your-tunnel.example.com
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      # Disable telemetry
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Timezone — adjust to your local timezone
      - GENERIC_TIMEZONE=Europe/Paris
      # Basic-auth for the n8n web UI (change before exposing publicly)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}

    volumes:
      # Workflow definitions, credentials, and execution history
      - n8n_data:/home/node/.n8n
      # Read-only access to the Polar database so n8n workflows can query it
      - ./data:/app/data:ro

    networks:
      - polar-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Cloudflare Tunnel (HTTPS ingress for Telegram webhooks) ─────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: polar-cloudflared
    restart: unless-stopped
    # No ports exposed — cloudflared opens outbound connections only.
    # Traffic is routed inward by Cloudflare's edge to the n8n service.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    depends_on:
      n8n:
        condition: service_healthy

    networks:
      - polar-net

volumes:
  n8n_data:
    driver: local

networks:
  polar-net:
    driver: bridge
