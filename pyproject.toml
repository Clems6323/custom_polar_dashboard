[project]
name = "polar-dashboard"
version = "0.1.0"
description = "Production-grade physiological analytics platform for Polar wearable devices"
requires-python = ">=3.12"
dependencies = [
    # Core data processing
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=16.0",
    # Database
    "duckdb>=1.0",
    # Visualization & UI
    "plotly>=5.22",
    "streamlit>=1.35",
    # Data validation & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP & networking
    "httpx>=0.27",
    "tenacity>=8.3",
    # Environment
    "python-dotenv>=1.0",
    # DuckDB requires pytz for TIMESTAMPTZ Python bindings
    "pytz>=2024.1",
    # BLE streaming (future live monitoring)
    "bleak>=0.22",
    "mcp[cli]>=1.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Expose all top-level src packages directly
packages = [
    "src/domain",
    "src/ingestion",
    "src/services",
    "src/storage",
    "src/polar_mcp",
    "src/ui",
    "src/utils",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "configs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed Anys
    "RUF022",  # allow semantically grouped __all__ (not just alphabetical)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"configs/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/", "scripts/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    # Streamlit UI — requires a running browser, not unit-testable
    "src/ui/streamlit/*",
    "src/ui/streamlit/**/*",
    # Polar AccessLink network layer — requires live OAuth2 + HTTP
    "src/ingestion/polar_accesslink/auth.py",
    "src/ingestion/polar_accesslink/client.py",
    "src/ingestion/polar_accesslink/endpoints/*",
    "src/ingestion/polar_accesslink/sync.py",
    # MCP server bootstrap (wired at runtime, not unit-testable)
    "src/polar_mcp/server.py",
    # Infrastructure startup code
    "src/storage/duckdb/connection.py",
    "src/utils/logging.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
